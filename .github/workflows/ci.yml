name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck install.sh mediactl
      - name: Validate YAML templates
        run: python3 -c 'import yaml,sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' config-templates/frigate.yml config-templates/homepage/services.yaml config-templates/homepage/settings.yaml config-templates/homepage/widgets.yaml config-templates/homepage/bookmarks.yaml
      - name: Validate base Compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
      - name: Validate GPU Compose override
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
