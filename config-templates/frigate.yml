# Frigate configuration. Add your camera details below and then run:
#   mediactl restart frigate
# Full reference: https://docs.frigate.video/configuration/
# Reolink camera guidance: https://docs.frigate.video/configuration/camera_specific#reolink-cameras

mqtt:
  enabled: false

# The installer changes this to GPU when /dev/dri/renderD128 is available.
detectors:
  openvino:
    type: openvino
    device: __OPENVINO_DEVICE__

# The bundled OpenVINO SSD MobileNet v2 model.
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  model_type: ssd

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 7
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 30

# go2rtc restreams let Frigate use one camera connection for recording and detection.
# Reolink cameras at 5MP or lower are usually most reliable with http-flv main streams.
# For example, use:
#   "ffmpeg:http://192.168.1.50/flv?port=1935&app=bcs&stream=channel0_main.bcs&user=admin&password=CAMERA_PASSWORD#video=copy#audio=copy"
# instead of RTSP when recommended by the linked camera guide. The RTSP URLs below
# are included as a general fallback and to show main/sub stream setup.
# UniFi Protect camera (see UNIFI.md): copy its RTSPS link from Protect, change rtsps to
# rtspx, drop ?enableSrtp, e.g. - rtspx://192.168.1.1:7441/abcdefghijk
# and add  ffmpeg: { output_args: { record: preset-record-ubiquiti } }  under the camera.
go2rtc:
  streams:
    front_door:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.50:554/h264Preview_01_main"
    front_door_sub:
      - "rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.50:554/h264Preview_01_sub"

cameras:
  front_door:
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/front_door_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    # Match your camera's sub stream resolution. Reolink 5MP sub streams are 640x360; Dahua/Amcrest sub streams can be set to 1280x720 in the camera's web UI.
    detect:
      width: 640
      height: 360
      fps: 5
    objects:
      track:
        - person
        - car
        - dog
        - cat
