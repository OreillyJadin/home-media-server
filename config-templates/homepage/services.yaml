- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://__LAN_IP__:8096
        description: Movies & TV
        siteMonitor: http://jellyfin:8096/health
        # To enable this widget, create an API key in Jellyfin under Dashboard → API Keys,
        # then uncomment the block and paste the key below.
        # widget:
        #   type: jellyfin
        #   url: http://jellyfin:8096
        #   key: <API key from Jellyfin Dashboard → API Keys>
        #   version: 2
        #   enableBlocks: true
- Cameras:
    - Frigate:
        icon: frigate.png
        href: https://__LAN_IP__:8971
        description: Security camera
        siteMonitor: http://frigate:5000/api/version
        # No Frigate widget: it would read Frigate's internal API without a login
        # and could show camera snapshots to anyone who opens the dashboard.
- Network:
